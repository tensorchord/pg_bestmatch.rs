[package]
name = "pg_bestmatch"
version = "0.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
pg15 = ["pgrx/pg15"]
pg16 = ["pgrx/pg16"]
pg17 = ["pgrx/pg17"]
pg18 = ["pgrx/pg18"]
pg19 = ["pgrx/pg19"]

[dependencies]
jieba-rs = "0.7.0"
lazy_static = "1.4.0"
pgrx = { version = "=0.20.1" }
rand = "0.8.5"
"tiktoken-rs" = "0.5.9"
tiniestsegmenter = "0.3.0"
tokenizers = { version = "0.19.1", default-features = false, features = [
    "http",
    "onig",
] }
