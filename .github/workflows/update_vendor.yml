name: Update Vendor

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SCCACHE_GHA_ENABLED: true
  RUSTC_WRAPPER: sccache
  RUSTFLAGS: "-Dwarnings"

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Generate
        run: |
          export PGRX_VERSION=$(grep 'pgrx = { version =' Cargo.toml | sed -E 's/.*version = "=([0-9]+\.[0-9]+\.[0-9]+)".*/\1/')
          for arch in amd64 arm64; do
            for version in 15 16 17 18 19; do
              docker run --rm --platform "linux/$arch" -v "$PWD:/mnt/build" \
                -e "VERSION=$version" -e PGRX_VERSION debian:bookworm bash /mnt/build/scripts/update_vendor.sh
            done
          done
          sudo chown -R $USER ./vendor
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: update vendor'
          title: 'chore: update vendor'
          body: 'Update vendor: `pg_config` contents and pgrx bindings.'
          branch: update-vendor
