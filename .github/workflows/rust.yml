name: Rust

on:
  push:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/**"
      - "src/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "pg_bestmatch.control"
      - "vendor/**"
  pull_request:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/**"
      - "src/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "pg_bestmatch.control"
      - "vendor/**"
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SCCACHE_GHA_ENABLED: true
  RUSTC_WRAPPER: sccache
  RUSTFLAGS: "-Dwarnings"

jobs:
  check:
    strategy:
      matrix:
        version: [15, 16, 17, 18, 19]
        arch: ["x86_64"]
    runs-on: ubuntu-latest
    env:
      SEMVER: "0.0.0"
      VERSION: ${{ matrix.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y "postgresql-server-dev-$VERSION" libclang-dev
          echo "PGRX_PG_CONFIG_PATH=/usr/lib/postgresql/$VERSION/bin/pg_config" >> "$GITHUB_ENV"
      - name: Set up Sccache
        uses: mozilla-actions/sccache-action@v0.0.4
      - name: Set up Cache
        uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ github.job }}-${{ hashFiles('./Cargo.lock') }}-${{ matrix.version }}-${{ matrix.arch }}
      - name: Clippy
        run: cargo clippy --locked --features "pg$VERSION" --target $ARCH-unknown-linux-gnu
      - name: Build
        run: cargo build --locked --lib --features "pg$VERSION" --target $ARCH-unknown-linux-gnu
      - name: Post Set up Cache
        uses: actions/cache/save@v4
        if: ${{ !steps.cache.outputs.cache-hit }}
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ github.job }}-${{ hashFiles('./Cargo.lock') }}-${{ matrix.version }}-${{ matrix.arch }}
